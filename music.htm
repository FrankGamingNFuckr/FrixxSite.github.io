<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061427" />
  <title>Frixx AI Covers</title>

  <link rel="icon" href="favicon.svg?v=20260318" type="image/svg+xml" />
  <link rel="icon" href="favicon.png?v=20260318" type="image/png" />

  <style>
    :root {
      --bg0: #061427;
      --bg1: #071a2b;
      --panel: rgba(5, 16, 32, 0.72);
      --panel-strong: rgba(5, 16, 32, 0.88);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.78);
      --gold: #ffcb05;
      --lime: #00ff1e;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --r: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 18% 10%, rgba(255, 203, 5, 0.12), transparent 50%),
                  radial-gradient(900px 600px at 82% 20%, rgba(0, 255, 30, 0.10), transparent 55%),
                  radial-gradient(900px 700px at 30% 85%, rgba(44, 125, 255, 0.12), transparent 55%),
                  linear-gradient(180deg, var(--bg0), var(--bg1) 35%, #040a14 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image: url('assets/starfield.svg');
      background-size: cover;
      background-position: center;
      filter: saturate(0.9) contrast(1.05);
      transform: translateZ(0);
      z-index: -2;
      animation: starDrift 28s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(850px 420px at 50% 0%, rgba(255, 203, 5, 0.08), transparent 60%),
                  radial-gradient(1100px 520px at 0% 65%, rgba(12, 120, 255, 0.10), transparent 55%);
      mix-blend-mode: screen;
      z-index: -1;
    }

    @keyframes starDrift {
      0% { transform: translate3d(0, 0, 0) scale(1.02); }
      50% { transform: translate3d(-1.8%, 1.2%, 0) scale(1.04); }
      100% { transform: translate3d(0, 0, 0) scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }

    .toggle-button {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 1100;
      appearance: none;
      border: 1px solid rgba(255, 203, 5, 0.35);
      background: rgba(5, 16, 32, 0.65);
      color: var(--gold);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .toggle-button:hover { transform: translateY(-1px); border-color: rgba(255, 203, 5, 0.6); }
    .toggle-button:active { transform: translateY(0); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    aside {
      position: fixed;
      top: 0;
      left: 0;
      width: min(320px, 88vw);
      height: 100dvh;
      background: linear-gradient(180deg, rgba(6, 20, 39, 0.95), rgba(4, 10, 20, 0.92));
      border-right: 1px solid rgba(255, 203, 5, 0.18);
      transform: translateX(-104%);
      transition: transform 0.22s ease;
      z-index: 1050;
      padding: 70px 16px 18px 16px;
      box-shadow: 26px 0 70px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    aside.open { transform: translateX(0); }

    aside nav {
      display: grid;
      gap: 8px;
    }

    aside a {
      text-decoration: none;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 203, 5, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-weight: 800;
      letter-spacing: 0.2px;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    aside a:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 203, 5, 0.35);
      background: rgba(255, 203, 5, 0.06);
    }

    .hero {
      padding: 70px 18px 20px 18px;
      display: grid;
      place-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-inner {
      width: min(1100px, calc(100vw - 36px));
      background: rgba(5, 16, 32, 0.62);
      border: 1px solid rgba(255, 203, 5, 0.16);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 3.6vw, 3rem);
      letter-spacing: 0.8px;
      color: var(--gold);
      text-shadow: 0 2px 18px rgba(255, 203, 5, 0.20);
    }

    .sub {
      margin: 10px 0 0 0;
      color: var(--muted);
      font-weight: 750;
    }

    .sub a { color: var(--gold); }

    main {
      width: min(1100px, calc(100vw - 36px));
      margin: 18px auto 32px auto;
    }

    .frame {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: var(--panel);
      box-shadow: var(--shadow);
      min-height: min(72dvh, 820px);
    }

    iframe {
      width: 100%;
      height: min(72dvh, 820px);
      border: 0;
      background: rgba(0, 0, 0, 0.25);
    }

    .frame-note {
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      color: rgba(234, 242, 255, 0.70);
      font-weight: 700;
      line-height: 1.4;
    }

    footer {
      width: min(1100px, calc(100vw - 36px));
      margin: 14px auto 30px auto;
      color: rgba(234, 242, 255, 0.65);
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .frame, iframe { height: 76dvh; min-height: 76dvh; }
    }
  </style>
</head>
<body>
  <button id="menuButton" class="toggle-button" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="overlay" class="overlay" hidden></div>

  <aside id="sidebar" aria-label="Site menu">
    <nav>
      <a href="index.htm">Home</a>
      <a href="agenda.htm">Agenda 2026</a>
      <a href="music.htm">Frixx AI Covers</a>
      <a href="https://github.com/FrankGamingNFuckr/FrixxSite.github.io" target="_blank" rel="noreferrer">My Site Repository</a>
      <a href="https://www.youtube.com/@Frixx420/videos" target="_blank" rel="noreferrer">YouTube Channel</a>
      <a href="https://discord.gg/2YkQygysEm" target="_blank" rel="noreferrer">Discord Server</a>
    </nav>
  </aside>

  <header class="hero">
    <div class="hero-inner">
      <h1>Frixx AI Covers</h1>
      <p class="sub">
        Embedded from
        <a href="https://frankgamingnfuckr.github.io/FrixxMusicSite.github.io/" target="_blank" rel="noreferrer">FrixxMusicSite</a>
        (opens in a new tab).
      </p>
    </div>
  </header>

  <main>
    <section class="frame" aria-label="Embedded music site">
      <iframe
        src="https://frankgamingnfuckr.github.io/FrixxMusicSite.github.io/"
        title="Frixx's AI Music Covers"
        loading="lazy"
        referrerpolicy="no-referrer"
        allow="autoplay; clipboard-read; clipboard-write"
      ></iframe>
      <div class="frame-note">
        If the embed doesn’t load in your browser, use the link above to open it directly.
      </div>
    </section>
  </main>

  <footer>© 2026 FrixxTV</footer>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menuButton');

    function setSidebarOpen(isOpen) {
      sidebar.classList.toggle('open', isOpen);
      overlay.classList.toggle('open', isOpen);
      menuButton.setAttribute('aria-expanded', String(isOpen));

      if (isOpen) {
        overlay.hidden = false;
      } else {
        overlay.hidden = true;
      }
    }

    function toggleSidebar() {
      setSidebarOpen(!sidebar.classList.contains('open'));
    }

    menuButton.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', () => setSidebarOpen(false));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setSidebarOpen(false);
    });

    sidebar.addEventListener('click', (event) => {
      const target = event.target;
      if (target instanceof HTMLAnchorElement) setSidebarOpen(false);
    });
  </script>
</body>
</html>
